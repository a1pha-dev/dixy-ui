            <div class="screen mission-screen" id="mission-screen">
                <div class="header">
                    <div class="header-title">🎮 Текущее Задание</div>
                </div>
                <div class="content">
                    <div class="mission-card" id="mission-card">
                        <div class="mission-title" id="mission-title">Загрузка...</div>
                        <div class="mission-description" id="mission-description">Пожалуйста подождите...</div>
                        <div class="mission-timer" id="mission-timer">0:00</div>

                            <div class="progress-label">Прогресс выполнения</div>

                                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>

                        </div>

                                <div class="stat-label">Кликов</div>
                                <div class="stat-value" id="stat-clicks">0</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-label">Лишних кликов</div>
                                <div class="stat-value" id="stat-unnecessary">0</div>
                            </div>
                        </div>
                    </div>
                </div>
