<!-- Success Modal -->
<div class="modal" id="success-modal">
    <div class="modal-content">
        <div class="modal-emoji">🎉</div>
        <div class="modal-title">Отлично!</div>
        <div class="modal-text">Задание выполнено успешно!</div>
        <div class="modal-stats">
            <div class="modal-stat-row">
                <span>Время:</span>
                <span id="modal-time">0 сек</span>
            </div>
            <div class="modal-stat-row">
                <span>Всего кликов:</span>
                <span id="modal-total-clicks">0</span>
            </div>
            <div class="modal-stat-row">
                <span>Лишних кликов:</span>
                <span id="modal-unnecessary-clicks">0</span>
            </div>
            <div class="modal-stat-row">
                <span>Точность:</span>
                <span id="modal-accuracy">0%</span>
            </div>
        </div>
        <button class="modal-btn" onclick="startNewMission()">✨ Новое Задание</button>
        <button class="modal-btn secondary" onclick="downloadLogs()" style="margin-top:8px;background:#f5f5f5;color:#333;">📥 Скачать логи</button>
    </div>
</div>
