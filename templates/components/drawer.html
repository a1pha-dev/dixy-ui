        <!-- Mission Drawer -->
        <div class="mission-drawer" id="mission-drawer">
            <div class="mission-drawer-header">
                <div class="mission-drawer-title">🎯 Текущее задание</div>
                <button class="mission-drawer-close" onclick="closeMissionDrawer()">✕</button>
            </div>
            <div class="mission-drawer-body">
                <div class="drawer-mission-card" id="drawer-mission-card">
                    <div class="drawer-mission-title" id="drawer-mission-title">Загрузка...</div>
                    <div class="drawer-mission-desc" id="drawer-mission-desc">Пожалуйста подождите...</div>
                    <div class="drawer-mission-timer" id="drawer-mission-timer">0:00</div>

                        <div class="drawer-progress-fill" id="drawer-progress-fill" style="width: 0%"></div>
                    </div>

                        <span>Прогресс</span>
                        <span id="drawer-progress-percent">0%</span>

                            <div class="drawer-stat-value" id="drawer-stat-clicks">0</div>
                        </div>
                        <div class="drawer-stat-box">

                </div>

            </div>
        </div>

        <button class="mission-drawer-trigger" id="mission-drawer-trigger" onclick="openMissionDrawer()">

            <span>Задание</span>
